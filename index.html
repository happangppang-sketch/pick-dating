<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff4f6e">
<title>Pick. — 로직이 보이는 소개팅</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--brand:#ff4f6e;--grad:linear-gradient(135deg,#ff4f6e,#ff8a5c);--bg:#fff;--soft:#f6f6f8;--line:#eeeef2;--text:#16161a;--muted:#8a8a96;--blue:#3b82f6;--gold:#f5b301}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:Pretendard,-apple-system,system-ui,"Apple SD Gothic Neo",sans-serif;color:var(--text);background:#f3eef0;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
@media(min-width:600px){body{background:radial-gradient(circle at 15% 15%,#ffdfe6,transparent 35%),radial-gradient(circle at 85% 85%,#ffe6d6,transparent 35%),#f6f1f3}}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
img{display:block}
svg{flex:none}
.phone{max-width:440px;margin:0 auto;min-height:100dvh;background:var(--bg);position:relative;box-shadow:0 0 60px rgba(0,0,0,.08)}
.muted{color:var(--muted)}.center{text-align:center}
.fine{font-size:12px;color:var(--muted);margin:10px 0 0}
.pad{padding:8px 20px 16px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:50px;padding:0 20px;border-radius:15px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:15px;transition:transform .1s}
.btn:active{transform:scale(.98)}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--grad);border:0;color:#fff;box-shadow:0 8px 20px rgba(255,79,110,.28)}
.btn.ghost{background:var(--soft);border-color:transparent}
.btn.block{width:100%}
.btn.sm{height:40px;padding:0 14px;font-size:14px;border-radius:12px}
.btn:disabled{opacity:.55;box-shadow:none;cursor:default}
.link{border:0;background:none;color:var(--brand);font-weight:700;padding:6px}
.icon-btn{width:40px;height:40px;border-radius:12px;border:0;background:transparent;display:grid;place-items:center;color:var(--text)}
.icon-btn svg{width:22px;height:22px}

/* top & tab bars */
.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:6px;height:56px;padding:0 10px 0 16px;background:rgba(255,255,255,.94);backdrop-filter:blur(10px)}
.topbar.plain{padding:0 6px}
.logo{font-weight:900;font-size:24px;letter-spacing:-.05em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.tb-title{flex:1;font-weight:800;font-size:17px;padding-left:6px}
.tabbar{position:sticky;bottom:0;z-index:5;display:grid;grid-template-columns:repeat(5,1fr);height:64px;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:#a1a1ab;font-weight:600;position:relative}
.tabbar svg{width:24px;height:24px}
.tabbar .on{color:var(--brand)}
.dot-badge{position:absolute;top:7px;left:calc(50% + 5px);background:var(--brand);color:#fff;font-size:10px;font-style:normal;font-weight:800;min-width:17px;height:17px;border-radius:9px;padding:0 4px;display:grid;place-items:center;border:2px solid #fff}
.content{min-height:calc(100dvh - 120px);padding:4px 16px 28px}

/* landing */
.landing{min-height:100dvh;display:flex;flex-direction:column;background:linear-gradient(180deg,#fff3f5,#fff 55%)}
.collage{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:26px 20px 0}
.collage img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:18px;box-shadow:0 10px 24px rgba(0,0,0,.08);background:#fde}
.collage img:nth-child(3n+2){transform:translateY(22px)}
.land-body{padding:40px 24px 28px;display:flex;flex-direction:column;gap:10px;margin-top:auto}
.logo.big{font-size:44px}
.land-body h1{font-size:28px;line-height:1.3;letter-spacing:-.03em;margin:0}
.land-body>p{color:var(--muted);margin:0 0 14px}

/* forms */
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.fld>span,.group-h{font-size:13px;font-weight:700;color:#4a4a55}
.fld input,.fld select,.fld textarea,.prompt-edit select,.prompt-edit textarea{width:100%;height:50px;border:1.5px solid var(--line);background:var(--soft);border-radius:14px;padding:0 14px;font-size:15px;outline:none;transition:border .15s}
.fld textarea,.prompt-edit textarea{height:auto;min-height:80px;padding:12px 14px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus,.prompt-edit textarea:focus{border-color:var(--brand);background:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.blk{margin-bottom:18px}
.group-h{display:flex;justify-content:space-between;margin-bottom:8px}
.group-h b{color:var(--brand)}
.chips-select{display:flex;flex-wrap:wrap;gap:8px}
.copt input{position:absolute;opacity:0;pointer-events:none}
.copt span{display:inline-flex;align-items:center;gap:4px;height:40px;padding:0 15px;border-radius:99px;border:1.5px solid var(--line);background:#fff;font-weight:600;font-size:14px;cursor:pointer;user-select:none;transition:.15s}
.copt input:checked+span{border-color:var(--brand);background:#fff1f3;color:var(--brand)}
.copt input:focus-visible+span{outline:2px solid var(--brand)}
.gender-pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gender-pick .copt span{height:62px;width:100%;justify-content:center;border-radius:16px;font-size:16px}
.check-row{display:flex;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);font-size:14.5px;cursor:pointer}
.check-row input{width:20px;height:20px;accent-color:var(--brand);flex:none}
.sub-h{font-size:16px;margin:4px 0 12px;display:flex;align-items:center;gap:6px}
.hint{font-size:12.5px;color:var(--muted);margin:-8px 0 16px}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pslot{position:relative;aspect-ratio:4/5;border-radius:16px;overflow:hidden;background:var(--soft);border:1.5px dashed #ddd;display:grid;place-items:center;color:#bbb}
.pslot img{width:100%;height:100%;object-fit:cover}
.pslot .del{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center}
.pslot .del svg{width:14px;height:14px}
.pslot .add{border:0;background:none;width:100%;height:100%;display:grid;place-items:center;color:var(--brand)}
.pslot .add svg{width:30px;height:30px}
.main-tag{position:absolute;left:6px;bottom:6px;background:var(--brand);color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px}
.prompt-edit{background:var(--soft);border-radius:16px;padding:10px;margin-bottom:10px;display:flex;flex-direction:column;gap:8px}
.prompt-edit select,.prompt-edit textarea{background:#fff;min-height:0}
.prompt-edit textarea{min-height:60px}

/* signup */
.su-top{position:sticky;top:0;background:#fff;z-index:5;padding-bottom:4px}
.su-top .topbar{justify-content:space-between}
.su-step{font-size:13px;color:var(--muted);font-weight:700}
.progress{height:4px;background:var(--line);border-radius:99px;margin:0 20px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--grad);transition:width .3s}
.su-title{padding:18px 20px 14px}
.su-title h1{font-size:25px;margin:0 0 4px;letter-spacing:-.03em}
.su-title p{margin:0;color:var(--muted);font-size:14px}
.su-foot{position:sticky;bottom:0;background:linear-gradient(rgba(255,255,255,0),#fff 35%);padding:22px 0 16px;margin-top:8px}

/* welcome */
.welcome{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px 24px;gap:8px;background:linear-gradient(180deg,#fff3f5,#fff)}
.big-check{width:88px;height:88px;border-radius:50%;background:var(--grad);display:grid;place-items:center;color:#fff;box-shadow:0 14px 30px rgba(255,79,110,.35);margin-bottom:10px}
.big-check svg{width:44px;height:44px;stroke-width:3}
.welcome h1{margin:0;font-size:28px}
.welcome p{color:#555;margin:0 0 20px}

/* shared bits */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;padding:4px 10px;border-radius:99px;background:var(--soft);color:#3f3f46;font-weight:600}
.chip.hit{background:#fff1f3;color:var(--brand)}
.vbadge{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--blue);color:#fff}
.vbadge svg{width:12px;height:12px;stroke-width:3.5}
.online{display:inline-flex;align-items:center;gap:4px;color:#16a34a;font-weight:700;font-size:13px}
.online::before{content:"";width:7px;height:7px;border-radius:50%;background:#22c55e}
.ring{--v:0;width:60px;height:60px;flex:none;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--brand) calc(var(--v)*1%),var(--line) 0)}
.ring span{width:48px;height:48px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:17px;font-weight:800;line-height:1}
.ring small{font-size:10px;color:var(--muted);font-weight:700}
.bd{display:flex;flex-direction:column;gap:10px}
.bd-row{display:grid;grid-template-columns:56px 1fr 46px;gap:10px;align-items:center}
.bd-row .lbl{font-weight:700;font-size:13px}
.bd-row .pts{text-align:right;font-weight:800;font-size:13px;font-variant-numeric:tabular-nums}
.bd-row .pts small{color:var(--muted);font-weight:500}
.bd-row .det{grid-column:2/4;font-size:12px;color:var(--muted);margin-top:-7px}
.bar{height:7px;background:#f0e9eb;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--grad);border-radius:99px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin:26px 0 10px;gap:8px}
.sec-h h3{margin:0;font-size:17px}
.sec-h span{font-size:12.5px;color:var(--muted)}
.sec-h b{color:var(--brand);font-variant-numeric:tabular-nums}
.empty{text-align:center;padding:50px 20px}
.empty .big{font-size:52px;margin-bottom:6px}
.empty h3{margin:0 0 6px;font-size:18px}
.empty p{color:var(--muted);margin:0 0 18px}
.empty .btn{margin:4px}
.note{background:var(--soft);border-radius:14px;padding:12px 14px;font-size:13px;color:#555;margin-bottom:14px}

/* home */
.eyebrow{font-size:13px;color:var(--brand);font-weight:800;margin:6px 0 2px}
.home-h{font-size:21px;letter-spacing:-.03em;margin:0 0 6px}
.funnel{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);margin-bottom:14px;flex-wrap:wrap}
.funnel b{color:var(--text)}
.pick-card{position:relative;border-radius:26px;overflow:hidden;aspect-ratio:4/5;box-shadow:0 16px 36px rgba(0,0,0,.13);cursor:pointer;background:#f3e6ea}
.pick-card>img{width:100%;height:100%;object-fit:cover}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,transparent 42%,rgba(0,0,0,.75));pointer-events:none}
.top-badge{position:absolute;top:14px;left:14px;background:var(--grad);color:#fff;font-weight:800;font-size:13px;padding:6px 12px;border-radius:99px;box-shadow:0 4px 12px rgba(255,79,110,.35)}
.score-badge{position:absolute;top:14px;right:14px;background:rgba(255,255,255,.95);border-radius:16px;padding:6px 12px;text-align:center;line-height:1.1}
.score-badge b{display:block;font-size:22px;color:var(--brand)}
.score-badge small{font-size:11px;color:var(--muted);font-weight:700}
.ov{position:absolute;left:18px;right:18px;bottom:18px;color:#fff}
.ov h2{font-size:27px;margin:0;display:flex;align-items:center;gap:8px;letter-spacing:-.02em}
.ov h2 span{font-weight:500}
.ov p{margin:2px 0 0;opacity:.92;font-size:14px;display:flex;align-items:center;gap:4px}
.ov p svg{width:15px;height:15px}
.why{margin-top:14px;padding:18px;border-radius:22px;background:#fff6f7;border:1px solid #ffe0e6}
.why h3{margin:0 0 6px;font-size:16px}
.why>p{margin:0 0 16px;font-size:14.5px;line-height:1.65}
.row-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}
.hscroll{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-inline:16px;margin:0 -16px;padding:0 16px 6px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.mini{flex:0 0 138px;scroll-snap-align:start;cursor:pointer}
.mini .ph{position:relative;aspect-ratio:3/4;border-radius:18px;overflow:hidden;background:#f3e6ea}
.mini img{width:100%;height:100%;object-fit:cover}
.pill{position:absolute;top:8px;left:8px;background:rgba(255,255,255,.95);color:var(--brand);font-weight:800;font-size:12px;padding:3px 8px;border-radius:99px}
.mini b{display:block;margin-top:7px;font-size:14.5px}
.mini small{color:var(--muted);font-size:12.5px}
.logic-banner{width:100%;margin-top:24px;border:0;text-align:left;background:#17171c;color:#fff;border-radius:20px;padding:16px 18px;display:flex;gap:14px;align-items:center}
.logic-banner .ico{width:44px;height:44px;border-radius:14px;background:var(--grad);display:grid;place-items:center;flex:none}
.logic-banner .ico svg{width:22px;height:22px}
.logic-banner b{display:block;font-size:15.5px}
.logic-banner small{opacity:.7;font-size:12.5px}

/* discover */
.content.discover{padding:2px 12px 0;display:flex;flex-direction:column;height:calc(100dvh - 120px);min-height:540px}
.deck{position:relative;flex:1;min-height:0}
.scard{position:absolute;inset:0;border-radius:24px;overflow:hidden;background:#f3e6ea;box-shadow:0 12px 30px rgba(0,0,0,.15);touch-action:none;user-select:none;-webkit-user-select:none;transition:transform .25s}
.scard.under{transform:scale(.95) translateY(12px);filter:brightness(.96)}
.photos{position:absolute;inset:0}
.photos img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;pointer-events:none;-webkit-user-drag:none;transition:opacity .15s}
.photos img.on{opacity:1}
.pbars{position:absolute;top:10px;left:12px;right:12px;display:flex;gap:4px;z-index:2}
.pbars i{flex:1;height:3.5px;border-radius:99px;background:rgba(255,255,255,.45)}
.pbars i.on{background:#fff}
.scard .ov{pointer-events:none}
.scard .chip{background:rgba(255,255,255,.22);color:#fff;backdrop-filter:blur(6px)}
.scard .chip.hit{background:var(--brand);color:#fff}
.score-pill{display:inline-flex;align-items:center;gap:4px;background:var(--grad);font-weight:800;font-size:13px;padding:4px 10px;border-radius:99px;margin-bottom:6px}
.sc-why{font-size:13px;opacity:.92;margin:8px 0 0}
.stamp{position:absolute;top:48px;padding:4px 14px;border:4px solid;border-radius:10px;font-weight:900;font-size:32px;letter-spacing:.06em;opacity:0;z-index:3;pointer-events:none}
.stamp.like{left:22px;color:#22c55e;transform:rotate(-14deg)}
.stamp.nope{right:22px;color:#ff4f6e;transform:rotate(14deg)}
.stamp.super{left:50%;top:auto;bottom:40%;color:var(--blue);transform:translateX(-50%)}
.actions{display:flex;justify-content:center;align-items:center;gap:14px;padding:14px 0 8px}
.act{width:62px;height:62px;border-radius:50%;border:0;background:#fff;box-shadow:0 6px 18px rgba(0,0,0,.1);display:grid;place-items:center;transition:transform .12s}
.act:active{transform:scale(.9)}
.act svg{width:28px;height:28px}
.act.sm{width:46px;height:46px}
.act.sm svg{width:20px;height:20px}
.act.nope{color:#ff4f6e}
.act.nope svg{stroke-width:3}
.act.like{color:#fff;background:var(--grad)}
.act.super{color:var(--blue)}
.act.undo{color:var(--gold)}
.act.info{color:#8b5cf6}
.act:disabled{opacity:.35}
.deck-hint{text-align:center;font-size:12px;color:var(--muted);margin:0 0 8px}

/* likes */
.seg{display:flex;background:var(--soft);border-radius:14px;padding:4px;margin:4px 0 14px}
.seg button{flex:1;height:38px;border:0;border-radius:11px;background:none;font-weight:700;color:var(--muted)}
.seg .on{background:#fff;color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.lgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lcard{position:relative;border-radius:18px;overflow:hidden;aspect-ratio:3/4;cursor:pointer;background:#f3e6ea}
.lcard>img{width:100%;height:100%;object-fit:cover}
.lcard .ov{left:12px;right:12px;bottom:12px}
.lcard .ov h2{font-size:17px}
.lcard .ov p{font-size:12px}
.lcard .tag{position:absolute;top:8px;left:8px;font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:99px;background:#fff;color:var(--brand)}
.lcard .tag.wait{color:var(--muted)}

/* chat list */
.avatars .av{flex:0 0 74px;text-align:center;cursor:pointer;scroll-snap-align:start}
.ring-img{width:70px;height:70px;border-radius:50%;padding:3px;background:var(--grad)}
.ring-img img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:3px solid #fff;background:#f3e6ea}
.av small{display:block;font-size:12.5px;font-weight:700;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.convo{display:flex;gap:12px;align-items:center;padding:10px 4px;cursor:pointer;border-radius:14px}
.convo:active{background:var(--soft)}
.convo>img{width:56px;height:56px;border-radius:50%;object-fit:cover;flex:none;background:#f3e6ea}
.convo .mid{flex:1;min-width:0}
.convo b{font-size:15px}
.convo p{margin:2px 0 0;color:var(--muted);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.convo.unread p{color:var(--text);font-weight:600}
.convo .time{font-size:12px;color:var(--muted);text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.udot{width:9px;height:9px;border-radius:50%;background:var(--brand)}

/* layers */
.sheet-full{position:fixed;top:0;bottom:0;left:0;right:0;margin:0 auto;width:100%;max-width:440px;background:#fff;z-index:40;overflow-y:auto;animation:up .25s ease}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* chat room */
.chat-room{display:flex;flex-direction:column;overflow:hidden}
.chat-room .topbar{border-bottom:1px solid var(--line);padding:0 6px}
.chat-room .topbar>img{width:38px;height:38px;border-radius:50%;object-fit:cover;cursor:pointer;background:#f3e6ea}
.who{flex:1;line-height:1.25;cursor:pointer}
.who small{display:block;color:var(--muted);font-size:12px}
.msgs{flex:1;overflow-y:auto;padding:12px 14px 16px;display:flex;flex-direction:column;gap:5px}
.match-intro{text-align:center;padding:18px 10px 20px;color:var(--muted);font-size:13px}
.match-intro .pics{display:flex;justify-content:center;margin-bottom:10px}
.match-intro .pics img{width:64px;height:64px;border-radius:50%;object-fit:cover;border:3px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.1);background:#f3e6ea}
.match-intro .pics img+img{margin-left:-14px}
.match-intro b{color:var(--text)}
.bubble{max-width:76%;padding:10px 14px;border-radius:20px;font-size:14.5px;line-height:1.45;word-break:break-word}
.bubble.them{align-self:flex-start;background:var(--soft);border-bottom-left-radius:6px}
.bubble.me{align-self:flex-end;background:var(--grad);color:#fff;border-bottom-right-radius:6px}
.btime{font-size:10.5px;color:var(--muted);margin:0 4px 6px}
.btime.me{align-self:flex-end}
.typing{display:inline-flex;gap:4px;align-items:center;height:20px}
.typing i{width:7px;height:7px;border-radius:50%;background:#bbb;animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,80%,100%{opacity:.3}40%{opacity:1}}
.ice{display:flex;gap:8px;overflow-x:auto;padding:8px 14px 2px;scrollbar-width:none}
.ice::-webkit-scrollbar{display:none}
.ice button{flex:none;border:1.5px solid #ffd2da;background:#fff6f7;color:var(--brand);border-radius:99px;padding:8px 14px;font-size:13px;font-weight:600}
.composer{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#fff}
.composer input{flex:1;height:44px;border-radius:22px;border:0;background:var(--soft);padding:0 16px;outline:none;min-width:0}
.send{width:44px;height:44px;border-radius:50%;border:0;background:var(--grad);color:#fff;display:grid;place-items:center;flex:none}

}
function reasonText(top,second){
  const good=top.items.filter(i=>i.pts>0).sort((a,b)=>b.pts/b.max-a.pts/a.max||b.pts-a.pts).slice(0,3).map(i=>i.short);
  let s=`<b>${esc(top.p.name)}</b>님은 ${esc(good.join(', '))} 덕분에 <b>${top.total}점</b>으로 1위예요.`;
  if(second){
    const diff=top.total-second.total;
    if(!diff)s+=` 2위 ${esc(second.p.name)}님과 동점이지만 동점 규칙(겹치는 관심사 수 → 나이 차)에 따라 앞섰어요.`;
    else{let best=null;top.items.forEach((it,k)=>{const d=it.pts-second.items[k].pts;if(!best||d>best.d)best={d,label:it.label}});
      s+=` 2위 ${esc(second.p.name)}님보다 ${diff}점 높고, 가장 크게 앞선 항목은 '${best.label}'(+${best.d}점)이에요.`}
  }
  const miss=top.items.filter(i=>i.pts<i.max).map(i=>`${i.label} ${i.pts}/${i.max}`);
  return s+(miss.length?` 아쉬운 점: ${esc(miss.join(', '))}.`:' 모든 항목 만점!');
}
/* 상대 입장에서 나를 좋아할지 (가상 프로필용 간단 점수) */
function theyLike(p,u){
  if(p.isUser){const o=users[p.id.slice(2)];return o&&o.likes['u:'+u.id]?100:0}
  const me=u.profile;if(me.gender!==(p.gender==='F'?'M':'F'))return 0;
  const ov=p.interests.filter(i=>me.interests.includes(i)).length,ad=Math.abs(p.age-ageOf(me));
  return Math.min(45,ov*15)+(ad<=3?20:ad<=5?10:0)+(p.religion===me.religion?10:0)+H(u.id+p.id)%30;
}
const receivedLikes=u=>pool(u).filter(p=>!u.matches[p.id]&&!u.likes[p.id]&&!u.passes.includes(p.id)&&theyLike(p,u)>=65);
function unreadCount(u){return Object.keys(u.matches).filter(id=>{const m=u.chats[id]||[];return byId(id)&&(!m.length||(m.length>(u.seen[id]||0)&&m[m.length-1].from==='them'))}).length}

   +`<div class="grid2">${fld('이상형 키',numIn('idealHeight',pr.idealHeight))}${fld('희망 연봉 (만원)',numIn('incomeWish',pr.incomeWish))}</div>`
   +grp('선호 외모 스타일 (안 고르면 상관없음)',checkChips('looksPref',LOOKS,pr.looksPref));

function collect(sec,fd,d){
  const p=d.profile,N=k=>Number(fd.get(k));
  switch(sec){
    case 'account':{const id=(fd.get('id')||'').trim(),pw=fd.get('pw')||'';
      if(!/^[a-zA-Z0-9_]{4,16}$/.test(id))return '아이디는 영문·숫자 4~16자예요';
      if(users[id])return '이미 사용 중인 아이디예요';
      if(pw.length<8)return '비밀번호는 8자 이상이에요';
      if(pw!==fd.get('pw2'))return '비밀번호가 서로 달라요';
      if(!fd.get('agree1')||!fd.get('agree2'))return '필수 항목에 동의해주세요';
      d.id=id;d.pw=pw;return null}
    case 'basic':{const name=(fd.get('name')||'').trim();
      if(!fd.get('gender'))return '성별을 선택해주세요';
      if(!name)return '닉네임을 입력해주세요';
      const h=N('height');if(!(h>=140&&h<=210))return '키를 확인해주세요 (140~210)';
      if(!fd.get('region'))return '지역을 선택해주세요';
      Object.assign(p,{name,gender:fd.get('gender'),birthYear:N('birthYear'),height:h,region:fd.get('region')});return null}
    case 'about':{
      if(!fd.get('looks'))return '외모 스타일을 골라주세요';
      if(!fd.get('religion'))return '종교를 골라주세요';
      if(fd.get('income')===''||N('income')<0)return '연봉을 입력해주세요 (학생이면 0)';
      Object.assign(p,{looks:fd.get('looks'),religion:fd.get('religion'),job:(fd.get('job')||'').trim(),income:N('income')});return null}
    case 'interests':{const it=fd.getAll('interests');
      if(it.length<3)return '관심사를 3개 이상 골라주세요';if(it.length>5)return '관심사는 5개까지예요';
      p.interests=it;return null}
    case 'photos':{const bio=(fd.get('bio')||'').trim();if(!bio)return '한 줄 소개를 써주세요';
      p.bio=bio;p.prompts=[0,1].map(i=>({q:fd.get('q'+i),a:(fd.get('a'+i)||'').trim()}));return null}
    case 'pref':{const pr={wantGender:fd.get('wantGender'),ageMin:N('ageMin'),ageMax:N('ageMax'),heightMin:N('heightMin'),heightMax:N('heightMax'),
        idealHeight:N('idealHeight'),looksPref:fd.getAll('looksPref'),blockRel:fd.getAll('blockRel'),incomeMin:N('incomeMin')||0,incomeWish:N('incomeWish')||0,
        requireInterest:d.pref?d.pref.requireInterest!==false:true};
      if(!pr.ageMin||!pr.ageMax||pr.ageMin>pr.ageMax)return '나이 범위를 확인해주세요';
      if(!pr.heightMin||!pr.heightMax||pr.heightMin>pr.heightMax)return '키 범위를 확인해주세요';
      if(!pr.idealHeight)return '이상형 키를 입력해주세요';
      if(pr.blockRel.length===RELIGIONS.length)return '모든 종교를 막으면 아무도 추천되지 않아요';
      d.pref=pr;return null}
  }
}

}
function bindSwipe(){
  const card=$('.scard.top');if(!card)return;
  let sx=0,sy=0,dx=0,dy=0,down=false;
  const st=n=>card.querySelector('.stamp.'+n);
  card.addEventListener('pointerdown',e=>{down=true;sx=e.clientX;sy=e.clientY;dx=dy=0;card.setPointerCapture(e.pointerId);card.style.transition='none'});
  card.addEventListener('pointermove',e=>{if(!down)return;dx=e.clientX-sx;dy=e.clientY-sy;
    card.style.transform=`translate(${dx}px,${dy}px) rotate(${dx/18}deg)`;
    st('like').style.opacity=Math.max(0,Math.min(1,dx/90));st('nope').style.opacity=Math.max(0,Math.min(1,-dx/90));
    st('super').style.opacity=Math.abs(dx)<60?Math.max(0,Math.min(1,-dy/120)):0});
  const end=e=>{if(!down)return;down=false;card.style.transition='';
    if(Math.abs(dx)<6&&Math.abs(dy)<6){card.style.transform='';const r=card.getBoundingClientRect();
      if(e.clientY-r.top>r.height*.62)openLayer('detail',card.dataset.id);else photoNav(card,e.clientX-r.left<r.width/2?-1:1);return}
    if(dx>110)return fly(card,1);if(dx<-110)return fly(card,-1);if(dy<-150&&Math.abs(dx)<80)return fly(card,0,true);
    card.style.transform='';card.querySelectorAll('.stamp').forEach(s=>s.style.opacity=0)};
  card.addEventListener('pointerup',end);card.addEventListener('pointercancel',end);
}
function fly(card,dir,sup){
  if(!card||card.dataset.flying)return;card.dataset.flying=1;const id=card.dataset.id;
  card.querySelector(sup?'.stamp.super':dir>0?'.stamp.like':'.stamp.nope').style.opacity=1;
  card.style.transition='transform .32s ease';
  card.style.transform=sup?'translate(0,-130%)':`translate(${dir*150}%,${dir?20:0}px) rotate(${dir*24}deg)`;
  setTimeout(()=>{dir<0?pass(id):like(id,{super:!!sup})},260);
}
function photoNav(root,delta){
  const imgs=root.querySelectorAll('.photos img'),bars=root.querySelectorAll('.pbars i');
  let i=[...imgs].findIndex(x=>x.classList.contains('on'));i=Math.max(0,Math.min(imgs.length-1,i+delta));
  imgs.forEach((x,k)=>x.classList.toggle('on',k===i));bars.forEach((x,k)=>x.classList.toggle('on',k===i));
}

function like(id,opt={}){
  const u=U(),p=byId(id);if(!p||u.matches[id])return;
  u.likes[id]={at:Date.now(),super:!!opt.super,comment:opt.comment||''};
  u.passes=u.passes.filter(x=>x!==id);
  const s=theyLike(p,u),matched=s>=60||(opt.super&&s>=45);
  if(V.layer&&V.layer.type==='detail'){V.layer=null;renderLayer()}
  if(!matched){persist();render();return toast(`${p.name}님에게 ${opt.super?'슈퍼 ':''}좋아요를 보냈어요${opt.comment?' 💬':''}`)}
  u.matches[id]={at:Date.now()};u.chats[id]=u.chats[id]||[];
  if(opt.comment)u.chats[id].push({from:'me',text:opt.comment,t:Date.now()});
  if(p.isUser){const o=users[id.slice(2)],k='u:'+u.id;o.matches[k]={at:Date.now()};o.chats[k]=o.chats[k]||[];if(opt.comment)o.chats[k].push({from:'them',text:opt.comment,t:Date.now()})}
  u.seen[id]=u.chats[id].length;
  persist();render();showMatch(p);
  if(!p.isUser){
    if(opt.comment)scheduleReply(id,opt.comment);
    else if(s>=72)setTimeout(()=>{const m=u.chats[id];if(m&&!m.length&&U()===u){m.push({from:'them',text:greet(p,u),t:Date.now()});persist();refresh(id)}},3500);
  }
}
function pass(id){
  const u=U();if(!u.passes.includes(id))u.passes.push(id);V.lastPass=id;persist();

const INTEREST_REPLY={'게임':'게임 얘기 나오면 못 참죠 ㅋㅋ 요즘 뭐 하세요? 같이 한 판 해요!','운동':'운동 좋아하시는구나! 주로 뭐 하세요? 💪','여행':'여행 최고죠 ✈️ 가장 좋았던 곳 어디예요?','영화':'요즘 볼만한 영화 있었어요? 저 추천 받는 거 좋아해요 🎬','독서':'최근에 읽은 책 뭐예요? 저도 리스트에 넣을래요 📚','요리':'요리 잘하세요? 자신 있는 메뉴 하나만 알려주세요 🍳','카페':'카페 투어 좋아해요 ☕ 아는 데 있으면 같이 가요!','음악':'요즘 무한반복 중인 노래 있어요? 🎧','등산':'등산! 주로 어느 산 가세요? ⛰️','사진':'사진 좋아하시는구나 📷 필름이에요 디카예요?','애니':'애니 인생작 하나만 말해주세요! 🌸','맛집':'맛집 얘기는 언제나 환영이에요 🍜 최근 최고는요?','반려동물':'반려동물 키우세요? 사진 보고 싶어요 🐾','전시회':'요즘 가볼 만한 전시 있을까요? 🖼️','코딩':'개발 하시는구나! 요즘 뭐 만들고 계세요? 💻'};
const GENERIC=['오 그렇구나요 ㅎㅎ 더 얘기해주세요!','ㅋㅋㅋ 재밌네요','저도 비슷한 생각 해본 적 있어요 😊','그럼 주말엔 보통 뭐 하세요?','대화 잘 통하는 것 같아요 ㅎㅎ'];
function greet(p,u){const c=p.interests.filter(i=>u.profile.interests.includes(i));return c.length?`안녕하세요! ${p.name}이에요 😊 ${c[0]} 좋아하신다고 해서 반가워서 먼저 인사드려요!`:`안녕하세요! ${p.name}이에요 😊 매칭돼서 반가워요!`}
function reply(p,text){
  if(/만나|약속|데이트|시간 되/.test(text))return '좋아요! 이번 주말 어때요? 시간 맞춰봐요 ☺️';
  const hit=INTERESTS.find(i=>text.includes(i)&&p.interests.includes(i))||p.interests.find(i=>text.includes(i));
  if(hit)return INTEREST_REPLY[hit];
  if(/[?？]\s*$/.test(text)){const pr=p.prompts&&p.prompts[0];return pr&&pr.a?`음… 저는 "${pr.a}" 이런 게 좋아요! 그쪽은요?`:`저는 ${p.interests[0]} 할 때가 제일 좋아요!`}
  return GENERIC[Math.floor(Math.random()*GENERIC.length)];

function sendMsg(id,text){
  const u=U(),p=byId(id);if(!p||!u.matches[id])return;
  (u.chats[id]=u.chats[id]||[]).push({from:'me',text,t:Date.now()});
  if(p.isUser){const o=users[id.slice(2)],k='u:'+u.id;if(o)(o.chats[k]=o.chats[k]||[]).push({from:'them',text,t:Date.now()})}
  u.seen[id]=u.chats[id].length;persist();renderLayer();
  if(!p.isUser)scheduleReply(id,text);
}
function scheduleReply(id,text){
  const u=U(),p=byId(id);
  setTimeout(()=>{V.typing[id]=true;refresh(id)},400);
  setTimeout(()=>{V.typing[id]=false;if(!u.matches[id])return;u.chats[id].push({from:'them',text:reply(p,text),t:Date.now()});persist();if(U()===u)refresh(id)},1300+Math.random()*900);
}
function refresh(id){
  if(V.layer&&V.layer.type==='chat'&&V.layer.id===id){U().seen[id]=(U().chats[id]||[]).length;persist();renderLayer()}
  else if(V.route==='app'&&V.tab==='chat'&&!V.layer)render();

function completeness(p){
  const parts=[[p.photos.length>0,20,'사진을 올려보세요'],[!!p.bio,15,'한 줄 소개를 써보세요'],[!!(p.prompts[0]&&p.prompts[0].a),15,'질문 카드에 답해보세요'],[!!(p.prompts[1]&&p.prompts[1].a),15,'두 번째 질문 카드도 채워보세요'],[p.interests.length>=3,15,''],[!!p.job,10,'직업을 적어보세요'],[!!p.region,10,'']];
  const score=parts.reduce((s,x)=>s+(x[0]?x[1]:0),0),tip=parts.find(x=>!x[0]&&x[2]);
  return {score,tip:tip?tip[2]+' (+'+tip[1]+'%)':'완벽해요! 매칭 확률이 가장 높은 상태예요'};
}

  </div></div>`;
}

function logicPreview(){
  const u=U(),L=V.logicDraft,tmp={...u,logic:{w:L.w,f:L.f},pref:{...u.pref,requireInterest:L.ri}},{passed}=rank(tmp),now=rank(u).passed[0];
  if(!passed.length)return `<h3>⚠️ 이 설정이면 통과하는 사람이 없어요</h3><p style="margin:0">거르기를 끄거나 범위를 넓혀보세요.</p>`;
  const t=passed[0],changed=now&&now.p.id!==t.p.id;
  return `<h3>미리보기 · 이 설정이면 1위는 ${esc(t.p.name)} (${t.total}점)</h3><p style="margin:0">${changed?`지금 1위 ${esc(now.p.name)}님 대신 <b>${esc(t.p.name)}</b>님이 1위가 돼요. `:'1위는 그대로예요. '}통과 ${passed.length}명 · 2위 ${passed[1]?esc(passed[1].p.name)+' '+passed[1].total+'점':'없음'}</p>`;
}
function readLogicForm(){
  const L=V.logicDraft;
  document.querySelectorAll('#layer [data-w]').forEach(r=>L.w[r.dataset.w]=Number(r.value));

  const L=$('#layer');if(!V.layer){L.innerHTML='';document.body.style.overflow='';return}

document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act,id=t.dataset.id,u=U();
  switch(a){
    case 'go-signup':V.route='signup';V.step=0;V.draft=newDraft();V.photoTarget=V.draft.profile;render();scrollTo(0,0);break;
    case 'go-login':V.route='login';render();break;
    case 'go-landing':V.route='landing';render();break;
    case 'demo':await demoLogin();break;
    case 'step-back':if(V.step===0)V.route='landing';else V.step--;render();scrollTo(0,0);break;
    case 'tab':V.route='app';V.tab=t.dataset.tab;V.layer=null;renderLayer();render();scrollTo(0,0);break;
    case 'detail':openLayer('detail',id);break;
    case 'close-layer':closeLayer();break;
    case 'logic':openLayer('logic');break;
    case 'pref':openLayer('pref');break;
    case 'logic-edit':openLogicEdit();break;
    case 'logic-preset':{const w=PRESETS[+t.dataset.i][1];document.querySelectorAll('#layer [data-w]').forEach(r=>r.value=w[r.dataset.w]);readLogicForm();toast(`'${PRESETS[+t.dataset.i][0]}' 비중을 적용했어요 (저장해야 반영)`);break}
    case 'logic-default':V.logicDraft={w:{...DEFAULT_LOGIC.w},f:{...DEFAULT_LOGIC.f},ri:true};renderLayer();toast('기본값으로 되돌렸어요 (저장해야 반영)');break;
    case 'logic-reset-now':delete u.logic;u.pref.requireInterest=true;persist();renderLayer();updateTabbar();toast('기본 로직으로 되돌렸어요');break;
    case 'edit':V.editDraft=clone(u.profile);V.photoTarget=V.editDraft;openLayer('edit');break;
    case 'like':like(id);break;
    case 'd-super':like(id,{super:true});break;
    case 'like-prompt':like(id,{comment:t.dataset.text});break;
    case 'd-pass':pass(id);break;
    case 'sw-like':fly($('.scard.top'),1);break;
    case 'sw-pass':fly($('.scard.top'),-1);break;
    case 'sw-super':fly($('.scard.top'),0,true);break;
    case 'sw-info':{const c=$('.scard.top');if(c)openLayer('detail',c.dataset.id);break}
    case 'undo':if(V.lastPass){u.passes=u.passes.filter(x=>x!==V.lastPass);V.lastPass=null;persist();render()}break;
    case 'ph-prev':photoNav(t.closest('.carousel'),-1);break;
    case 'ph-next':photoNav(t.closest('.carousel'),1);break;
    case 'open-chat':openChat(id);break;
    case 'close-modal':closeModal();break;
    case 'ice':sendMsg(id,t.dataset.text);break;
    case 'unmatch':{const p=byId(id);if(p&&confirm(`${p.name}님과의 매칭을 해제할까요? 대화도 사라져요.`)){delete u.matches[id];delete u.chats[id];delete u.likes[id];if(!u.passes.includes(id))u.passes.push(id);
      if(p.isUser){const o=users[id.slice(2)],k='u:'+u.id;if(o){delete o.matches[k];delete o.chats[k]}}persist();closeLayer();toast('매칭을 해제했어요')}break}
    case 'likes-seg':V.likesSeg=t.dataset.seg;render();break;
    case 'photo-add':if(V.photoTarget&&V.photoTarget.photos.length>=3)toast('사진은 3장까지예요');else $('#file').click();break;
    case 'photo-del':V.photoTarget.photos.splice(+t.dataset.i,1);refreshPhotoGrid();break;
    case 'reset-pass':u.passes=[];V.lastPass=null;persist();V.tab='discover';V.route='app';V.layer=null;renderLayer();render();toast('패스한 사람을 다시 보여드려요');break;
    case 'logout':session=null;store.set('pk.session',null);V.route='landing';V.tab='home';V.layer=null;renderLayer();closeModal();render();toast('로그아웃했어요');break;
    case 'withdraw':if(confirm('정말 탈퇴할까요? 계정과 대화가 모두 삭제돼요.')){
      for(const o of Object.values(users)){const k='u:'+u.id;delete o.likes[k];delete o.matches[k];delete o.chats[k];o.passes=o.passes.filter(x=>x!==k)}
      delete users[u.id];persist();session=null;store.set('pk.session',null);V.route='landing';V.tab='home';render();toast('탈퇴했어요')}break;
  }
});
document.addEventListener('submit',async e=>{
  const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();
  const fd=new FormData(f),k=f.dataset.form;
  if(k==='login'){const id=(fd.get('id')||'').trim(),x=users[id];
    if(!x||await hashPw(fd.get('pw')||'',x.salt)!==x.pwHash)return toast('아이디 또는 비밀번호가 맞지 않아요');
    session=id;store.set('pk.session',id);V.route='app';V.tab='home';render();toast(`${x.profile.name}님, 반가워요!`)}
  else if(k==='step'){const sec=STEPS[V.step].key,err=collect(sec,fd,V.draft);if(err)return toast(err);
    if(sec==='basic')V.draft.pref=defaultPref(V.draft.profile.gender,ageOf(V.draft.profile));
    if(V.step<STEPS.length-1){V.step++;render();scrollTo(0,0)}else await finishSignup()}
  else if(k==='chat'){const text=(fd.get('m')||'').trim();if(text){f.querySelector('input').value='';sendMsg(f.dataset.id,text)}}
  else if(k==='edit'){for(const s of ['basic','about','interests','photos']){const err=collect(s,fd,{profile:V.editDraft});if(err)return toast(err)}
    U().profile=V.editDraft;persist();closeLayer();toast('프로필을 저장했어요')}
  else if(k==='logic'){const u=U(),L=V.logicDraft;if(!W_KEYS.some(([w])=>L.w[w]>0))return toast('점수 비중이 모두 0이면 채점할 수 없어요');
    u.logic={w:{...L.w},f:{...L.f}};u.pref.requireInterest=L.ri;persist();V.layer=null;renderLayer();render();toast('로직을 바꿨어요. 추천을 다시 계산했어요')}
  else if(k==='pref'){const d={profile:U().profile,pref:U().pref},err=collect('pref',fd,d);if(err)return toast(err);
    U().pref=d.pref;persist();V.layer=null;renderLayer();render();toast('조건을 바꿨어요. 추천을 다시 계산했어요')}
});
document.addEventListener('input',e=>{if(e.target.closest('form[data-form=logic]'))readLogicForm()});
document.addEventListener('change',e=>{
  if(e.target.closest('form[data-form=logic]'))readLogicForm();
  if(e.target.name==='interests'){const n=document.querySelectorAll('input[name=interests]:checked').length;
    if(n>5){e.target.checked=false;toast('관심사는 5개까지예요')}
    const c=$('#int-count');if(c)c.textContent=document.querySelectorAll('input[name=interests]:checked').length}
});
$('#file').addEventListener('change',async e=>{
  const f=e.target.files[0];e.target.value='';if(!f||!V.photoTarget)return;
  try{V.photoTarget.photos.push(await cropImage(f));refreshPhotoGrid()}catch(err){toast('이미지를 읽을 수 없어요')}
});
function refreshPhotoGrid(){const g=$('#photo-grid');if(g&&V.photoTarget)g.innerHTML=photoGridInner(V.photoTarget.photos)}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#modal').innerHTML)closeModal();else if(V.layer)closeLayer()}});

render();
</script>
</body>
</html>
